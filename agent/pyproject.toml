[project]
name = "rayner-agent"
version = "0.1.0"
description = "LangGraph agent service behind Rayner OS's capture box"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.7",
    "langchain-core>=0.3.28",
    "langchain-openai>=0.2.14",
    "langsmith>=0.2",
    "supabase>=2.10",
    "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "uvicorn[standard]>=0.32",
    "ruff>=0.8",
    "langgraph-cli[inmem]>=0.1.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rayner_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]
